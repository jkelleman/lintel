<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lintel demo</title>
<style>
@font-face{font-family:Nunito;font-weight:400;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:900;src:url(fonts/nunito-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:Kalam;font-weight:700;src:url(fonts/kalam-latin-700-normal.woff2) format("woff2")}
:root{--mint:#DFF3E8;--ink:#2B2A4C;--soft:#5E5D82;--violet:#6B5BD2;--pen:#E0457B}
*{box-sizing:border-box}
body{margin:0;background:var(--mint);color:var(--ink);font:17px/1.55 Nunito,ui-rounded,system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:40px 20px 72px}
h1{font-weight:900;font-size:38px;letter-spacing:-.6px;line-height:1.1;margin:0 0 8px}
p{margin:0 0 20px;color:var(--soft);max-width:62ch}
.note{font-family:Kalam,cursive;font-weight:700;color:var(--pen);font-size:22px}
video{display:block;width:100%;height:auto;border-radius:22px;background:#fff}
.chapters{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0;padding:0;list-style:none}
.chapters button{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:2px solid transparent;border-radius:999px;padding:8px 16px;cursor:pointer}
.chapters button[aria-current="true"]{border-color:var(--violet);color:var(--violet)}
.chapters button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.chapters span{color:var(--soft);font-weight:400;margin-left:6px}
a{color:var(--violet);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>See lintel in 30 seconds</h1>
  <p>Pause any time. When you press play, the demo picks up where you left off. Jump to a step with the buttons below the video.</p>
  <video id="demo" controls playsinline muted preload="metadata" poster="assets/demo-poster.png">
    <source src="assets/demo.mp4" type="video/mp4">
    <a href="assets/demo.gif">Watch the GIF version</a>
  </video>
  <ul class="chapters" aria-label="Demo steps">
    <li><button data-t="0">1. Check a reply<span>0:00</span></button></li>
    <li><button data-t="6.4">2. Test a new version<span>0:06</span></button></li>
    <li><button data-t="15.1">3. Read the report<span>0:15</span></button></li>
  </ul>
  <p style="margin-top:28px"><span class="note">Tip:</span> press the space bar to pause or play.
    <a href="https://github.com/jkelleman/lintel">Back to the repo</a> or <a href="sample-report.html">open the sample report</a>.</p>
</main>
<script>
  const v = document.getElementById("demo");
  const buttons = [...document.querySelectorAll(".chapters button")];
  buttons.forEach(b => b.addEventListener("click", () => {
    v.currentTime = Number(b.dataset.t);
    v.play();
  }));
  v.addEventListener("timeupdate", () => {
    let active = buttons[0];
    buttons.forEach(b => { if (v.currentTime >= Number(b.dataset.t)) active = b; });
    buttons.forEach(b => b.setAttribute("aria-current", String(b === active)));
  });
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && !["BUTTON", "VIDEO", "A"].includes(document.activeElement.tagName)) {
      e.preventDefault();
      v.paused ? v.play() : v.pause();
    }
  });
</script>
</body>
</html>
