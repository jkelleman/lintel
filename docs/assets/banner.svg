<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="t d">
  <title id="t">lintel</title>
  <desc id="d">lintel checks every AI agent reply, from word choice to actions, and decides whether a release ships or holds. Four rungs: lint, contracts, trajectory, judge, then a ship or hold gate.</desc>
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a948f"/>
    </marker>
  </defs>
  <rect width="1280" height="380" rx="20" fill="#f7f6f2"/>
  <!-- beam motif: a lintel over an opening -->
  <rect x="56" y="54" width="62" height="12" rx="2" fill="#0b5c78"/>
  <rect x="60" y="66" width="10" height="34" fill="#0b5c78"/>
  <rect x="104" y="66" width="10" height="34" fill="#0b5c78"/>
  <text x="140" y="98" class="sans" font-size="54" font-weight="700" fill="#1d2321" letter-spacing="-1">lintel</text>
  <text x="56" y="150" class="sans" font-size="27" font-weight="600" fill="#1d2321">Checks every AI agent reply, from word choice to actions, and decides: ship or hold.</text>
  <text x="56" y="186" class="sans" font-size="19" fill="#5d6763">A content-owned eval ladder for AI assistants in design software. Rules in YAML. Runs in CI.</text>

  <g class="sans">
    <!-- rungs -->
    <g transform="translate(56,226)">
      <rect width="196" height="104" rx="12" fill="#fff" stroke="#dfe3e1"/>
      <text x="18" y="34" class="mono" font-size="14" fill="#5d6763">1</text>
      <text x="36" y="35" font-size="21" font-weight="650" fill="#1d2321">Lint</text>
      <text x="18" y="64" font-size="15" fill="#5d6763">Word choice, terms,</text>
      <text x="18" y="85" font-size="15" fill="#5d6763">reading level</text>
    </g>
    <line x1="256" y1="278" x2="282" y2="278" stroke="#8a948f" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(288,226)">
      <rect width="196" height="104" rx="12" fill="#fff" stroke="#dfe3e1"/>
      <text x="18" y="34" class="mono" font-size="14" fill="#5d6763">2</text>
      <text x="36" y="35" font-size="21" font-weight="650" fill="#1d2321">Contracts</text>
      <text x="18" y="64" font-size="15" fill="#5d6763">Reply shape, e.g.</text>
      <text x="18" y="85" font-size="15" fill="#5d6763">after an error</text>
    </g>
    <line x1="488" y1="278" x2="514" y2="278" stroke="#8a948f" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(520,226)">
      <rect width="196" height="104" rx="12" fill="#fff" stroke="#dfe3e1"/>
      <text x="18" y="34" class="mono" font-size="14" fill="#5d6763">3</text>
      <text x="36" y="35" font-size="21" font-weight="650" fill="#1d2321">Trajectory</text>
      <text x="18" y="64" font-size="15" fill="#5d6763">What the agent did:</text>
      <text x="18" y="85" font-size="15" fill="#5d6763">asked, acted, reported</text>
    </g>
    <line x1="720" y1="278" x2="746" y2="278" stroke="#8a948f" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(752,226)">
      <rect width="196" height="104" rx="12" fill="#fff" stroke="#dfe3e1"/>
      <text x="18" y="34" class="mono" font-size="14" fill="#5d6763">4</text>
      <text x="36" y="35" font-size="21" font-weight="650" fill="#1d2321">Judge</text>
      <text x="18" y="64" font-size="15" fill="#5d6763">Rubric scores, checked</text>
      <text x="18" y="85" font-size="15" fill="#5d6763">against human labels</text>
    </g>
    <line x1="952" y1="278" x2="978" y2="278" stroke="#8a948f" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- gate -->
    <g transform="translate(984,226)">
      <rect width="240" height="104" rx="12" fill="#1d2321"/>
      <text x="20" y="35" font-size="21" font-weight="650" fill="#fff">Release gate</text>
      <rect x="20" y="54" width="86" height="32" rx="16" fill="#1f7a4d"/>
      <text x="63" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">SHIP</text>
      <rect x="116" y="54" width="86" height="32" rx="16" fill="#b42318"/>
      <text x="159" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">HOLD</text>
    </g>
  </g>
</svg>
