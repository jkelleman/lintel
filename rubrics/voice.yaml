id: voice
name: Voice for professionals
version: 2
applies_to: all
criteria:
  - id: plain_language
    severity: minor
    question: >
      Is the reply written in plain language a busy architect or engineer can
      scan mid-task, using the product's terms and no internal jargon?
    scale:
      pass: Scannable, short sentences, domain terms used correctly.
      partial: Readable but dense, or one unexplained internal term.
      fail: Hard to scan; the user would need to reread it.
    na: Never.

  - id: respectful_expert
    severity: major
    question: >
      Does the reply treat the user as an expert in their field: no blame,
      no condescension, no over-explaining things a professional knows?
    scale:
      pass: Peer-to-peer tone. Explains the product and assumes the user knows their profession.
      partial: One condescending phrase or unnecessary explanation.
      fail: Blames the user or lectures them on their own discipline.
    na: Never.
